name: CD - Build, Push and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ${{ vars.IMAGE_NAME || (secrets.DOCKER_USERNAME != '' && format('{0}/mi-app', secrets.DOCKER_USERNAME)) || 'mi-app' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v6

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push de la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escaneo de vulnerabilidades
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-staging:
    needs: build-and-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Desplegar en staging
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE="${{ env.IMAGE_NAME }}:latest"

            docker pull "$IMAGE"
            docker rm -f mi-app-staging-new || true
            docker run -d \
              --name mi-app-staging-new \
              --restart unless-stopped \
              -p 3001:3000 \
              "$IMAGE"

            sleep 5

            if curl -sf http://localhost:3001/health; then
              echo "Health check de staging exitoso. Activando nuevo contenedor..."
              docker stop mi-app-staging || true
              docker rm mi-app-staging || true
              docker run -d \
                --name mi-app-staging \
                --restart unless-stopped \
                -p 8080:3000 \
                "$IMAGE"
              docker rm -f mi-app-staging-new || true
            else
              echo "Health check de staging FALLIDO. Se mantiene la version anterior."
              docker rm -f mi-app-staging-new || true
              exit 1
            fi

            docker system prune -f

  deploy-production:
    needs: deploy-staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Desplegar en produccion
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE="${{ env.IMAGE_NAME }}:latest"

            docker pull "$IMAGE"
            docker rm -f mi-app-new || true
            docker run -d \
              --name mi-app-new \
              --restart unless-stopped \
              -p 3001:3000 \
              "$IMAGE"

            sleep 5

            if curl -sf http://localhost:3001/health; then
              echo "Health check exitoso. Activando nuevo contenedor..."
              docker stop mi-app || true
              docker rm mi-app || true
              docker run -d \
                --name mi-app \
                --restart unless-stopped \
                -p 80:3000 \
                "$IMAGE"
              docker rm -f mi-app-new || true
            else
              echo "Health check FALLIDO. Cancelando despliegue y manteniendo version anterior."
              docker rm -f mi-app-new || true
              exit 1
            fi

            docker system prune -f
